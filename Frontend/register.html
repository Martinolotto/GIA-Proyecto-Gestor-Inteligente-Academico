<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIA | Registro</title>

    <link rel="icon" type="image/png" href="assets/img/logo-gia-circular.png" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>

  <body>
    <div class="register-page d-flex align-items-center justify-content-center">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-8 col-xl-7">
            <div class="register-card p-4 p-md-5">
              <div class="card-header-line"></div>

              <div class="text-center mb-4">
                <img
                  src="assets/img/logo-GIA.png"
                  alt="Logo GIA"
                  class="custom-logo mb-3"
                  width="110"
                />

                <h1 class="register-title">Registra tu institución</h1>

                <p class="register-subtitle mb-0">
                  Complete el siguiente formulario para solicitar el acceso a
                  GIA.
                </p>
              </div>

              <form>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="nombre"> Nombre </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                      </span>

                      <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        placeholder="Ingrese su nombre"
                      />
                    </div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="apellido"> Apellido </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                      </span>

                      <input
                        type="text"
                        class="form-control"
                        id="apellido"
                        placeholder="Ingrese su apellido"
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="email">
                      Correo electrónico
                    </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-envelope-fill"></i>
                      </span>

                      <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="nombre@institucion.edu.ar"
                      />
                    </div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="dni"> DNI </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-person-badge-fill"></i>
                      </span>

                      <input
                        type="number"
                        class="form-control"
                        id="dni"
                        placeholder="Ingrese su DNI"
                      />
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label" for="institucion">
                    Institución
                  </label>

                  <div class="input-group custom-input-group">
                    <span class="input-group-text">
                      <i class="bi bi-building-fill"></i>
                    </span>

                    <input
                      type="text"
                      class="form-control"
                      id="institucion"
                      placeholder="Ingrese el nombre de la institución"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="codigo"> Código CUE </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-patch-check-fill"></i>
                      </span>

                      <input
                        type="text"
                        class="form-control"
                        id="codigo"
                        placeholder="Ingrese el código CUE"
                      />
                    </div>

                    <div class="form-text">
                      Código único otorgado a la institución educativa.
                    </div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="usuario"> Usuario </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-at"></i>
                      </span>

                      <input
                        type="text"
                        class="form-control"
                        id="usuario"
                        placeholder="Nombre de usuario de la institución"
                      />
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="password">
                      Contraseña
                    </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                      </span>

                      <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="••••••••"
                      />
                    </div>
                  </div>

                  <div class="col-md-6 mb-4">
                    <label class="form-label" for="confirmPassword">
                      Confirmar contraseña
                    </label>

                    <div class="input-group custom-input-group">
                      <span class="input-group-text">
                        <i class="bi bi-shield-lock-fill"></i>
                      </span>

                      <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        placeholder="••••••••"
                      />
                    </div>
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="terms" />

                  <label class="form-check-label" for="terms">
                    He leído y acepto los términos y condiciones de uso.
                  </label>
                </div>

                <button type="submit" class="btn btn-register w-100">
                  Registrar usuario
                </button>

                <p class="login-text text-center mt-4 mb-0">
                  ¿Ya posee una cuenta?
                  <a href="login.html"> Iniciar sesión </a>
                </p>

                <div class="login-footer text-center mt-4">
                  © 2026 GIA - Gestor Inteligente Académico
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/js/register.js"></script>
  </body>
</html>
