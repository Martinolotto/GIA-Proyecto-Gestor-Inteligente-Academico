<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIA | Resultados</title>
    <link rel="icon" type="image/png" href="assets/img/logo-gia-circular.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      .resultado-card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        transition: transform 0.2s, box-shadow 0.2s;
        cursor: pointer;
      }
      .resultado-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.14);
      }
      .resultado-img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 12px;
        background: #f0f4ff;
      }
      .badge-aprobado {
        background: #e6f9f0;
        color: #1a7a4a;
        font-size: 0.75rem;
        border-radius: 20px;
        padding: 4px 12px;
      }
      .search-hero {
        background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);
        padding: 60px 0 40px;
        color: white;
      }
      .search-bar-wrap {
        background: white;
        border-radius: 12px;
        padding: 6px;
        display: flex;
        gap: 8px;
        max-width: 700px;
        margin: 0 auto;
      }
      .search-bar-wrap input {
        border: none;
        outline: none;
        flex: 1;
        padding: 10px 16px;
        font-size: 1rem;
        border-radius: 8px;
      }
      .search-bar-wrap button {
        border-radius: 8px;
        padding: 10px 24px;
      }
      .sin-resultados {
        text-align: center;
        padding: 80px 0;
        color: #888;
      }
    </style>
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg gia-navbar sticky-top">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand" href="index.html">
          <img src="assets/img/logo-GIA.png" alt="GIA" class="gia-logo" />
        </a>
        <div class="gia-auth ms-auto">
          <a href="login.html" class="gia-login">Iniciar sesión</a>
        </div>
      </div>
    </nav>

    <!-- Hero de búsqueda -->
    <section class="search-hero">
      <div class="container text-center">
        <h1 class="fw-bold mb-2">Buscá tu institución</h1>
        <p class="mb-4 opacity-75">Encontrá carreras, requisitos y más información</p>
        <div class="search-bar-wrap">
          <input type="text" id="input-busqueda" placeholder="Nombre de institución o localidad..." />
          <button class="btn btn-primary" onclick="buscar()">
            <i class="bi bi-search me-1"></i> Buscar
          </button>
        </div>
      </div>
    </section>

    <!-- Resultados -->
    <section class="py-5">
      <div class="container">
        <div id="contador-resultados" class="mb-4 text-muted small"></div>
        <div id="contenedor-resultados" class="row g-4">
          <!-- Las cards se generan con JS -->
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const API = "http://localhost:3000";

      // Al cargar la página, buscar con el parámetro de la URL (viene del buscador del index)
      window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const q = params.get("q") || "";
        document.getElementById("input-busqueda").value = q;
        buscar(q);
      });

      async function buscar(termino = null) {
        const query = termino !== null ? termino : document.getElementById("input-busqueda").value.trim();
        const contenedor = document.getElementById("contenedor-resultados");
        const contador = document.getElementById("contador-resultados");

        contenedor.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-muted">Buscando instituciones...</p>
          </div>`;

        try {
          const url = query
            ? `${API}/instituciones?nombre=${encodeURIComponent(query)}`
            : `${API}/instituciones`;

          const res = await fetch(url);
          const instituciones = await res.json();

          if (!instituciones.length) {
            contenedor.innerHTML = `
              <div class="col-12 sin-resultados">
                <i class="bi bi-search" style="font-size:3rem;opacity:0.3"></i>
                <h5 class="mt-3">No encontramos resultados para "${query}"</h5>
                <p>Intentá con otro término o buscá por localidad.</p>
              </div>`;
            contador.textContent = "";
            return;
          }

          contador.textContent = `${instituciones.length} institución${instituciones.length > 1 ? "es" : ""} encontrada${instituciones.length > 1 ? "s" : ""}`;

          contenedor.innerHTML = instituciones.map(inst => `
            <div class="col-12 col-md-6 col-lg-4">
              <div class="resultado-card card h-100 p-3" onclick="window.location.href='perfil-instituciones.html?id=${inst.id}'">
                <div class="d-flex align-items-center gap-3 mb-3">
                  <img src="${inst.imagen_url}" alt="${inst.nombre_institucion}" class="resultado-img" onerror="this.src='assets/img/logo-gia-circular.png'" />
                  <div>
                    <h6 class="fw-bold mb-1">${inst.nombre_institucion}</h6>
                    <span class="badge-aprobado"><i class="bi bi-check-circle-fill me-1"></i>Verificada</span>
                  </div>
                </div>
                <div class="text-muted small">
                  <p class="mb-1"><i class="bi bi-geo-alt me-1"></i>${inst.localidad}</p>
                  <p class="mb-1"><i class="bi bi-patch-check me-1"></i>CUE: ${inst.cue}</p>
                  <p class="mb-0"><i class="bi bi-envelope me-1"></i>${inst.email}</p>
                </div>
                <div class="mt-3">
                  <span class="btn btn-sm btn-outline-primary w-100">Ver perfil <i class="bi bi-arrow-right ms-1"></i></span>
                </div>
              </div>
            </div>
          `).join("");

        } catch (error) {
          contenedor.innerHTML = `
            <div class="col-12 text-center py-5 text-danger">
              <i class="bi bi-exclamation-triangle" style="font-size:2rem"></i>
              <p class="mt-2">Error al cargar instituciones. Verificá que el servidor esté corriendo.</p>
            </div>`;
        }
      }

      // Buscar al presionar Enter
      document.getElementById("input-busqueda")?.addEventListener("keypress", (e) => {
        if (e.key === "Enter") buscar();
      });
    </script>
  </body>
</html>
